<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Data Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">
    <div class="max-w-4xl mx-auto p-4">

        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Bayern Munich (054efa67) Dashboard</h1>
            <p class="text-sm text-gray-500">Season 2025/2026</p>
        </header>

        <!-- Insights / Next Match -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div id="next-match-card" class="bg-blue-600 text-white rounded-lg shadow p-6 flex flex-col justify-center text-center">
                <h2 class="text-lg font-semibold mb-2">Next Match</h2>
                <div id="next-match-details" class="text-xl font-bold">Loading...</div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">Team Insights</h2>
                <ul id="insights-list" class="space-y-2">
                    <li>Loading...</li>
                </ul>
            </div>
        </div>

        <!-- Chart -->
        <div class="bg-white rounded-lg shadow p-6 mb-8 overflow-hidden">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">GF vs xG per Match</h2>
            <div class="relative w-full" style="height: 300px;">
                <canvas id="gfXgChart"></canvas>
            </div>
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-700">Match Logs</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 text-sm">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left font-medium text-gray-500 uppercase tracking-wider">Date</th>
                            <th scope="col" class="px-6 py-3 text-left font-medium text-gray-500 uppercase tracking-wider">Comp</th>
                            <th scope="col" class="px-6 py-3 text-left font-medium text-gray-500 uppercase tracking-wider">Venue</th>
                            <th scope="col" class="px-6 py-3 text-left font-medium text-gray-500 uppercase tracking-wider">Opponent</th>
                            <th scope="col" class="px-6 py-3 text-left font-medium text-gray-500 uppercase tracking-wider">Result</th>
                            <th scope="col" class="px-6 py-3 text-right font-medium text-gray-500 uppercase tracking-wider">GF</th>
                            <th scope="col" class="px-6 py-3 text-right font-medium text-gray-500 uppercase tracking-wider">GA</th>
                            <th scope="col" class="px-6 py-3 text-right font-medium text-gray-500 uppercase tracking-wider">xG</th>
                        </tr>
                    </thead>
                    <tbody id="matches-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- Matches will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
