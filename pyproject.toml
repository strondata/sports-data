[tool.poetry]
name = "sports-data"
version = "0.1.0"
description = "Um framework ETL desenvolvido em Python para abstrair a recolha, limpeza e armazenamento de dados de performance desportiva."
authors = ["Jules <jules@example.com>"]
readme = "README.md"
packages = [{include = "sports_data", from = "src"}, {include = "api", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.0.0"
beautifulsoup4 = "^4.12.0"
requests = "^2.31.0"
typer = "^0.9.0"
pydantic = "^2.0.0"
fastapi = "^0.100.0"
uvicorn = "^0.23.0"
sqlalchemy = "^2.0.0"
lxml = "^6.1.0"
html5lib = "^1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
ruff = "^0.1.0"
mypy = "^1.5.0"
responses = "^0.23.0"
pytest-asyncio = "^0.21.1"
pandas-stubs = "^3.0.0.260204"
types-requests = "^2.33.0.20260408"

[tool.poetry.scripts]
sports-data = "sports_data.cli.main:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
